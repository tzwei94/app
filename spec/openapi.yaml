openapi: 3.0.3
info:
  title: Banking API
  version: 0.1.0
  description: JWT-protected SGD account operations. Liquibase runs separately from the
    serving process. Actuator is isolated on loopback port 9000.
servers:
- url: http://localhost:8080
  description: Direct local JAR; Docker uses an assigned loopback port. Deployment uses the public HTTPS hostname.
security:
- bearerAuth: []
paths:
  /auth/token:
    post:
      operationId: issueToken
      summary: Exchange administrator or managed-user Basic credentials for a 15-minute Bearer token
      description: >-
        No request body. The configured administrator receives TOKEN_SUBJECT and
        the users:manage scope. Managed users receive their immutable user UUID
        as subject, a credential version and no administrative scope. Clients
        cannot choose claims or token lifetime. Deleted users cannot log in.
      security:
      - basicAuth: []
      responses:
        '200':
          description: RS256 access token. Responses must not be cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Pragma:
              schema:
                type: string
                enum: [no-cache]
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                    enum: [900]
        '401':
          description: Missing or invalid Basic credentials.
  /accounts/list:
    get:
      operationId: listOwnedAccounts
      summary: List accounts owned by the authenticated subject
      description: Ordered by account ID. Empty pages return an empty array; no other owner's records are returned.
      parameters:
      - $ref: '#/components/parameters/ListLimit'
      - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Owned account summaries.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AccountSummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users:
    get:
      operationId: listUsers
      summary: List active managed users
      description: >-
        Requires an administrator JWT with users:manage scope. Ordered by
        username and ID. The configured administrator is outside this managed
        directory. Deleted users are excluded; empty pages return [].
      parameters:
      - $ref: '#/components/parameters/ListLimit'
      - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Safe user profiles; credential material is never returned.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/UserProfile'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/DirectoryForbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createUser
      summary: Create a managed user with individual login credentials
      description: >-
        Requires users:manage scope. The server assigns an immutable UUID subject.
        New users have no accounts and cannot manage the directory. The configured
        administrator login name and deleted users' final usernames are reserved.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUser'}
      responses:
        '201':
          description: User created; password is hashed and never returned.
          headers:
            Location: {schema: {type: string}, description: Relative URL of the new user.}
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfile'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/DirectoryForbidden'}
        '409': {$ref: '#/components/responses/UserConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: getUser
      summary: Read a managed user profile
      description: Requires users:manage scope; deleted or unknown users return 404.
      responses:
        '200':
          description: Safe user profile.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfile'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/DirectoryForbidden'}
        '404': {$ref: '#/components/responses/UserNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: updateUser
      summary: Replace a user's username and display name, optionally resetting their password
      description: >-
        Requires users:manage scope. Username changes preserve the UUID subject
        and account ownership. Omitted or null password keeps the current
        password; a password change immediately revokes all previously issued
        managed-user JWTs. Changing profile fields alone keeps tokens valid.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUser'}
      responses:
        '200':
          description: Updated safe user profile.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfile'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/DirectoryForbidden'}
        '404': {$ref: '#/components/responses/UserNotFound'}
        '409': {$ref: '#/components/responses/UserConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteUser
      summary: Soft-delete a managed user and revoke their credentials
      description: >-
        Requires users:manage scope. Retains the user record, final username,
        accounts and transaction ledger. Login and previously issued managed-user
        JWTs stop working immediately. Deleting an unknown or already deleted
        user returns 404.
      responses:
        '204':
          description: User deleted; no response body.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/DirectoryForbidden'}
        '404': {$ref: '#/components/responses/UserNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /accounts/{id}/balance:
    get:
      operationId: balance
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current account balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid JWT.
        '404':
          description: Unknown or unowned account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Redacted server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{id}/deposits:
    post:
      operationId: deposits
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        description: Scoped to the account; replay returns the original balance. Different
          operation or amount for the same key returns 409.
      responses:
        '200':
          description: Current balance, or the original result for an identical idempotent
            retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid JWT.
        '404':
          description: Unknown or unowned account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Redacted server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Insufficient funds, balance limit, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Money'
  /accounts/{id}/withdrawals:
    post:
      operationId: withdrawals
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        description: Scoped to the account; replay returns the original balance. Different
          operation or amount for the same key returns 409.
      responses:
        '200':
          description: Current balance, or the original result for an identical idempotent
            retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid JWT.
        '404':
          description: Unknown or unowned account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Redacted server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Insufficient funds, balance limit, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Money'
  /demo/cpu:
    post:
      operationId: cpuDemo
      summary: Run bounded CPU-only work to demonstrate ECS CPU scaling
      description: >-
        Normal JWT authentication is required. CPU_DEMO_ENABLED is enabled by the
        demo deployment configuration and disabled in the base application.
        One worker per task, no backlog, and a 100 ms recovery gap. SHA-256 hashes
        use fixed-size reusable buffers; no database or external calls.
        The monotonic deadline includes scheduling delay and is checked every
        256 hashes. Scheduling and the final batch can cause deadline overshoot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workMs:
                  type: integer
                  nullable: true
                  minimum: 50
                  maximum: 500
                  default: 250
      responses:
        '200':
          description: Bounded work completed; cpuMs can be lower than elapsedMs under CPU throttling, or zero when unsupported.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                type: object
                required: [workMs, elapsedMs, cpuMs, iterations, checksum, stopReason]
                properties:
                  workMs: {type: integer, minimum: 50, maximum: 500}
                  elapsedMs: {type: number, minimum: 0}
                  cpuMs: {type: number, minimum: 0}
                  iterations: {type: integer, minimum: 0, maximum: 5000000}
                  checksum: {type: string, pattern: '^[a-f0-9]{64}$'}
                  stopReason: {type: string, enum: [deadline, iteration_limit]}
        '400':
          description: Invalid work amount or request body.
        '401':
          description: Missing or invalid JWT.
        '404':
          description: CPU demo is disabled.
        '429':
          description: Worker busy or in its recovery gap; code cpu_demo_busy. No work is queued.
          headers:
            Retry-After:
              schema: {type: string, enum: ['1']}
        '503':
          description: Shutdown, cancellation or timeout; work stops cooperatively.
  /livez:
    get:
      operationId: livez
      security: []
      responses:
        '200':
          description: Minimal public status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: readyz
      description: Runs SELECT 1 to check database connectivity; does not verify schema or migration state.
      security: []
      responses:
        '200':
          description: Minimal public status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /version:
    get:
      operationId: version
      description: Reports the packaged Maven version and SOURCE_SHA; defaults are dev and local when unavailable.
      security: []
      responses:
        '200':
          description: Minimal public status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: RS256 JWT
  parameters:
    ListLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    ListOffset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, maximum: 2147483647, default: 0}
  responses:
    InvalidRequest:
      description: Invalid request or pagination.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing, invalid, expired or revoked credentials.
    DirectoryForbidden:
      description: JWT lacks the required users:manage scope.
    UserNotFound:
      description: User is unknown or deleted; code user_not_found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UserConflict:
      description: Username already exists or is reserved; code username_exists or username_reserved.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Redacted server failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, username, displayName]
      properties:
        id: {type: string, format: uuid}
        username: {type: string, pattern: '^[a-z][a-z0-9._-]{2,63}$'}
        displayName: {type: string, minLength: 1, maxLength: 100}
    CreateUser:
      type: object
      required: [username, displayName, password]
      properties:
        username: {type: string, pattern: '^[a-z][a-z0-9._-]{2,63}$'}
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Must contain at least one non-whitespace character.
        password:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
          description: Nonblank, at most 72 UTF-8 bytes. Stored as a BCrypt hash; never returned.
    UpdateUser:
      type: object
      required: [username, displayName]
      properties:
        username: {type: string, pattern: '^[a-z][a-z0-9._-]{2,63}$'}
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Must contain at least one non-whitespace character.
        password:
          type: string
          nullable: true
          minLength: 12
          maxLength: 72
          writeOnly: true
          description: Omit or use null to retain credentials; a nonblank password (at most 72 UTF-8 bytes) revokes old tokens.
    AccountSummary:
      type: object
      additionalProperties: false
      required: [id, balance, currency]
      properties:
        id: {type: string, format: uuid}
        balance: {type: number, minimum: 0, example: 100.0}
        currency: {type: string, enum: [SGD]}
    Balance:
      type: object
      required:
      - balance
      - currency
      properties:
        balance:
          type: number
          example: 100.0
        currency:
          type: string
          enum:
          - SGD
    Money:
      type: object
      required:
      - amount
      properties:
        amount:
          type: number
          minimum: 0.01
          maximum: 99999999999999999.99
          multipleOf: 0.01
          description: Positive decimal with at most 17 integer digits and 2 fractional
            digits. Send decimal JSON numbers.
    Error:
      type: object
      required:
      - code
      properties:
        code:
          type: string
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
    Version:
      type: object
      required:
      - version
      - source
      properties:
        version:
          type: string
        source:
          type: string
