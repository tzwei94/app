openapi: 3.0.3
info:
  title: Banking API
  version: 0.1.0
  description: JWT-protected SGD account operations. Liquibase runs separately from the
    serving process. Actuator is isolated on loopback port 9000.
servers:
- url: http://localhost:8080
  description: Direct local JAR; Docker uses an assigned loopback port. Deployment uses the public HTTPS hostname.
security:
- bearerAuth: []
paths:
  /auth/token:
    post:
      operationId: issueToken
      summary: Exchange configured Basic credentials for a 15-minute Bearer token
      description: No request body. The server selects the subject; clients cannot choose claims or token lifetime.
      security:
      - basicAuth: []
      responses:
        '200':
          description: RS256 access token. Responses must not be cached.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Pragma:
              schema:
                type: string
                enum: [no-cache]
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                    enum: [900]
        '401':
          description: Missing or invalid Basic credentials.
  /accounts/{id}/balance:
    get:
      operationId: balance
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current account balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid JWT.
        '404':
          description: Unknown or unowned account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Redacted server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{id}/deposits:
    post:
      operationId: deposits
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        description: Scoped to the account; replay returns the original balance. Different
          operation or amount for the same key returns 409.
      responses:
        '200':
          description: Current balance, or the original result for an identical idempotent
            retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid JWT.
        '404':
          description: Unknown or unowned account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Redacted server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Insufficient funds, balance limit, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Money'
  /accounts/{id}/withdrawals:
    post:
      operationId: withdrawals
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        description: Scoped to the account; replay returns the original balance. Different
          operation or amount for the same key returns 409.
      responses:
        '200':
          description: Current balance, or the original result for an identical idempotent
            retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid JWT.
        '404':
          description: Unknown or unowned account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Redacted server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Insufficient funds, balance limit, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Money'
  /demo/cpu:
    post:
      operationId: cpuDemo
      summary: Run bounded CPU-only work to demonstrate ECS CPU scaling
      description: >-
        Normal JWT authentication is required. CPU_DEMO_ENABLED is enabled by the
        demo deployment configuration and disabled in the base application.
        One worker per task, no backlog, and a 100 ms recovery gap. SHA-256 hashes
        use fixed-size reusable buffers; no database or external calls.
        The monotonic deadline includes scheduling delay and is checked every
        256 hashes. Scheduling and the final batch can cause deadline overshoot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workMs:
                  type: integer
                  nullable: true
                  minimum: 50
                  maximum: 500
                  default: 250
      responses:
        '200':
          description: Bounded work completed; cpuMs can be lower than elapsedMs under CPU throttling, or zero when unsupported.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                type: object
                required: [workMs, elapsedMs, cpuMs, iterations, checksum, stopReason]
                properties:
                  workMs: {type: integer, minimum: 50, maximum: 500}
                  elapsedMs: {type: number, minimum: 0}
                  cpuMs: {type: number, minimum: 0}
                  iterations: {type: integer, minimum: 0, maximum: 5000000}
                  checksum: {type: string, pattern: '^[a-f0-9]{64}$'}
                  stopReason: {type: string, enum: [deadline, iteration_limit]}
        '400':
          description: Invalid work amount or request body.
        '401':
          description: Missing or invalid JWT.
        '404':
          description: CPU demo is disabled.
        '429':
          description: Worker busy or in its recovery gap; code cpu_demo_busy. No work is queued.
          headers:
            Retry-After:
              schema: {type: string, enum: ['1']}
        '503':
          description: Shutdown, cancellation or timeout; work stops cooperatively.
  /livez:
    get:
      operationId: livez
      security: []
      responses:
        '200':
          description: Minimal public status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: readyz
      description: Runs SELECT 1 to check database connectivity; does not verify schema or migration state.
      security: []
      responses:
        '200':
          description: Minimal public status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /version:
    get:
      operationId: version
      description: Reports the packaged Maven version and SOURCE_SHA; defaults are dev and local when unavailable.
      security: []
      responses:
        '200':
          description: Minimal public status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: RS256 JWT
  schemas:
    Balance:
      type: object
      required:
      - balance
      - currency
      properties:
        balance:
          type: number
          example: 100.0
        currency:
          type: string
          enum:
          - SGD
    Money:
      type: object
      required:
      - amount
      properties:
        amount:
          type: number
          minimum: 0.01
          maximum: 99999999999999999.99
          multipleOf: 0.01
          description: Positive decimal with at most 17 integer digits and 2 fractional
            digits. Send decimal JSON numbers.
    Error:
      type: object
      required:
      - code
      properties:
        code:
          type: string
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
    Version:
      type: object
      required:
      - version
      - source
      properties:
        version:
          type: string
        source:
          type: string
