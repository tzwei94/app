server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: banking-api
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:banking_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml
  lifecycle:
    timeout-per-shutdown-phase: 25s
management:
  server:
    port: 9000
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: banking-api
banking:
  token:
    username: ${TOKEN_USERNAME:}
    password: ${TOKEN_PASSWORD:}
    subject: ${TOKEN_SUBJECT:alice}
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    issuer: ${JWT_ISSUER:banking-demo}
    audience: ${JWT_AUDIENCE:banking-api}
logging:
  threshold:
    console: WARN
  file:
    name: ${LOG_PATH:/tmp/banking}/application.log
  structured:
    format:
      file: logstash
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 2
      total-size-cap: 30MB
      file-name-pattern: ${LOG_PATH:/tmp/banking}/application.%d{yyyy-MM-dd}.%i.log

# The starter configures tracing in the application; no JVM agent is needed.
# Metrics are scraped from Actuator and logs are collected from files by Alloy.
otel:
  service:
    name: ${OTEL_SERVICE_NAME:banking-api}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:otlp}
    sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
    sampler-arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}
  metrics:
    exporter: none
  logs:
    exporter: none
  instrumentation:
    jdbc:
      query-sanitization:
        enabled: true
    logback-appender:
      enabled: false
    logback-mdc:
      enabled: true
