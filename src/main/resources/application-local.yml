# Explicit local profile; binds HTTP and management to loopback.
# Supply DB credentials and a JWT signing private key and Basic credentials through the environment.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/banking}
    username: ${DB_USERNAME:banking_test}
server:
  address: 127.0.0.1
  port: 8080
