name: "Reusable: Build and Scan Image"

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Archive containing the scanned Docker image
        value: ${{ jobs.build.outputs.artifact-name }}
      image-id:
        description: Docker configuration digest of the scanned image
        value: ${{ jobs.build.outputs.image-id }}
      image-digest:
        description: Manifest digest of the exported image
        value: ${{ jobs.build.outputs.image-digest }}
      version:
        description: Maven project version embedded in the application
        value: ${{ jobs.build.outputs.version }}
      local-image:
        description: Unique local image tag in the archive
        value: ${{ jobs.build.outputs.local-image }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-name: container-${{ github.run_id }}-${{ github.run_attempt }}
      image-id: ${{ steps.build.outputs.imageid }}
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
      local-image: banking-api:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read committed Maven version
        id: version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const { readPomVersion } = require('./.github/scripts/release.cjs');
            core.setOutput('version', readPomVersion(fs.readFileSync('pom.xml', 'utf8')));
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package application JAR
        run: ./mvnw -B --no-transfer-progress -DskipTests package
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image tags and provenance labels
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: banking-api
          tags: type=raw,value=ci-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build image once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            SOURCE_SHA=${{ github.sha }}
            JAR_FILE=target/banking-api-*.jar
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/banking-api.tar
          cache-from: type=gha,scope=banking-api
          cache-to: type=gha,mode=max,scope=banking-api
          provenance: false
      - name: Scan the exact image archive
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          input: ${{ runner.temp }}/banking-api.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-report.txt
      - name: Archive scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Pass scanned image to publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/banking-api.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
