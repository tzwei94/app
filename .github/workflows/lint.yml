name: I. Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Workflows, Java and release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check Java sources
        run: ./mvnw -B --no-transfer-progress checkstyle:check
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Validate banking API contract
        run: scripts/validate-api.sh
      - name: Test release policy
        run: node --test .github/scripts/*.test.cjs
      - name: Upload Java lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-lint-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/checkstyle-result.xml
          if-no-files-found: warn
          retention-days: 14
